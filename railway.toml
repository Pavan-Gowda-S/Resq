[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'alembic -c backend/alembic.ini upgrade head && python simulation/seed_data/seed_phase2.py && python simulation/seed_data/seed_phase4.py && python simulation/seed_data/seed_users.py && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT'"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
