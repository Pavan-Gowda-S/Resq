services:
  # PostgreSQL 16 with PostGIS extension
  db:
    image: postgis/postgis:16-3.4
    container_name: resq-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resq_password}
      POSTGRES_DB: ${POSTGRES_DB:-resq_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resq_user} -d ${POSTGRES_DB:-resq_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for real-time messaging, caching, and rate-limiting
  redis:
    image: redis:7-alpine
    container_name: resq-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
