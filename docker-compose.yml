services:
  # PostgreSQL 16 with PostGIS extension
  db:
    image: postgis/postgis:16-3.4
    container_name: resq-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resq_password}
      POSTGRES_DB: ${POSTGRES_DB:-resq_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resq_user} -d ${POSTGRES_DB:-resq_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for real-time messaging, caching, and rate-limiting
  redis:
    image: redis:7-alpine
    container_name: resq-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service (optional local containerization)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resq-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://resq_user:resq_password@db:5432/resq_db
      - DATABASE_SYNC_URL=postgresql://resq_user:resq_password@db:5432/resq_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=change-this-to-a-secure-random-secret-key-in-production
      - AGENT_SYSTEM_API_KEY=resq_agent_internal_secret_token
      - ENVIRONMENT=development
      - DEBUG=True
    command: >
      sh -c "alembic -c backend/alembic.ini upgrade head &&
             python simulation/seed_data/seed_phase2.py &&
             python simulation/seed_data/seed_phase4.py &&
             uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
