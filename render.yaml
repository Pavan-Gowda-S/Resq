services:
  - type: web
    name: resq-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: AGENT_SYSTEM_API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: resq-postgis
          property: connectionString
      - key: DATABASE_SYNC_URL
        fromDatabase:
          name: resq-postgis
          property: connectionString
    healthCheckPath: /health

databases:
  - name: resq-postgis
    databaseName: resq_db
    user: resq_user
    plan: free
    region: singapore
